<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO -->
    <title>Shivam Kumar — Full Stack Engineer & UI/UX Designer</title>
    <meta name="description" content="Portfolio of Shivam Kumar — a full stack engineer specialising in React, Node.js, and scalable web applications. Let's build something impactful together." />
    <meta name="author" content="Shivam Kumar" />
    <!-- Open Graph -->
    <meta property="og:title" content="Shivam Kumar — Full Stack Engineer" />
    <meta property="og:description" content="Crafting high-performance web experiences with clean architecture and scalable design." />
    <meta property="og:type" content="website" />

    <!-- Theme & Favicon -->
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Optimized fonts: only used weights, non-render-blocking preload pattern -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Hard refresh always lands on homepage (top)
      try {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        if (location.hash && location.hash !== "#home") {
          history.replaceState(null, "", location.pathname + location.search);
        }
        window.scrollTo(0, 0);
      } catch (_) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
